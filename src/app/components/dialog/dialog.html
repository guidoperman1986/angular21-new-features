<div class="bg-black/50 fixed inset-0 flex items-center justify-center h-screen w-screen">
  <div class="rounded-lg bg-white p-6 w-1/2 h-1/2 flex flex-col">
    <h2 class="mb-4 text-2xl font-bold text-gray-800">{{ title() }}</h2>
    <p class="text-gray-600 flex-1 my-4 bg-blue-50">{{ content() }}</p>

    <div class="flex justify-end">
      <button class="rounded-md bg-blue-500 px-4 py-2 text-white" (click)="onClose.emit()">
        Close
      </button>
    </div>
  </div>
</div>
