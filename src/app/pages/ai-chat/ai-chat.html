<div class="mx-auto max-w-2xl space-y-4 p-6">
  <h2 class="text-2xl font-bold">Asistente de AI con Angular & Gemini</h2>

  <div class="flex gap-2">
    <input
      type="text"
      [formField]="promptForm.prompt"
      (keyup.enter)="sendPrompt()"
      placeholder="Escribe tu consulta..."
      class="flex-1 rounded-lg border p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" />
    <button
      (click)="sendPrompt()"
      [disabled]="isLoading() || !userPrompt().trim()"
      class="rounded-lg bg-blue-600 px-4 py-2 text-white disabled:bg-gray-400">
      Enviar
    </button>
  </div>

  @if (promptForm.prompt().touched() && promptForm.prompt().invalid()) {
    <div class="error-list text-red-500">
      @for (error of promptForm.prompt().errors(); track error) {
        <p>{{ error.message }}</p>
      }
    </div>
  }

  @if (aiResponse()) {
    <div class="mt-4 rounded-lg border border-gray-200 bg-gray-100 p-4 whitespace-pre-wrap">
      <p class="mb-2 font-semibold text-gray-700">Respuesta:</p>
      {{ aiResponse() }}
    </div>
  }
</div>
